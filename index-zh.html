<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 情报板</title>
<style>body{font-family:system-ui,"PingFang SC",sans-serif;max-width:820px;margin:0 auto;padding:20px;background:#f7f7f5}input,select{width:100%;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:14px;margin:12px 0}button{background:#111;color:#fff;border:0;border-radius:8px;padding:8px 14px}button.ghost{background:#fff;color:#111;border:1px solid #ccc}.muted{color:#888;font-size:13px}.tag{display:inline-block;background:#eee;border-radius:12px;padding:2px 8px;font-size:12px}</style></head>
<body><h1>AI 情报板</h1><p class="muted">非官方工具，与 OpenAI 及任何模型厂商无关。自己加 AI 新闻、打标签、搜索，复制推广清单。链接指向原文，不上传、不登录、不要 API Key，数据只存在浏览器本地。</p>
<div class="card"><h3>官方来源（只是链接，不代表官方）</h3><p><a href="https://openai.com/news/" target="_blank" rel="noopener">OpenAI News</a> · <a href="https://blog.google/technology/ai/" target="_blank" rel="noopener">Google AI Blog</a> · <a href="https://www.anthropic.com/news" target="_blank" rel="noopener">Anthropic News</a> · <a href="https://huggingface.co/blog" target="_blank" rel="noopener">Hugging Face Blog</a></p><p class="muted">转发前请先去原文核对。</p></div>
<div class="card"><input id="title" placeholder="标题，例如：某模型新发布"><input id="source" placeholder="来源，例如：OpenAI Blog"><input id="url" placeholder="链接，例如：https://..."><select id="tag"><option>OpenAI</option><option>Google</option><option>Anthropic</option><option>模型</option><option>工具</option><option>研究</option></select><button onclick="add()">加入情报</button> <button class="ghost" onclick="copyList()">复制推广清单</button></div>
<input id="q" placeholder="搜索情报…" oninput="render()"><div id="list"></div>
<script>
const KEY='ai-intel-v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');
if(!items.length){items=[{title:'示例：转发 AI 新闻前先去官方博客核对',source:'AI 情报板',url:'',tag:'工具'}];}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function save(){localStorage.setItem(KEY,JSON.stringify(items));render();}
function add(){const t=title.value.trim();if(!t)return alert('先填标题');items.unshift({title:t,source:source.value.trim(),url:url.value.trim(),tag:tag.value});title.value='';source.value='';url.value='';save();}
function del(i){items.splice(i,1);save();}
function render(){const q=(document.getElementById('q').value||'').toLowerCase();const list=items.filter(x=>(x.title+' '+x.source+' '+x.tag).toLowerCase().includes(q));document.getElementById('list').innerHTML=list.map(x=>{const idx=items.indexOf(x);return '<div class="card"><span class="tag">'+esc(x.tag)+'</span> <b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.source)+'</span>'+(x.url?' <a href="'+esc(x.url)+'" target="_blank" rel="noopener">打开原文</a>':'')+'<br><button class="ghost" onclick="del('+idx+')">删除</button></div>';}).join('')||'<p class="muted">还没有情报，先在上面加一条。</p>';}
function copyList(){const t=items.slice(0,5).map((x,i)=>(i+1)+'. '+x.title+(x.source?'（'+x.source+'）':'')).join('\n');navigator.clipboard.writeText('今日 AI 情报：\n'+t).then(()=>alert('推广清单已复制'));}
render();
</script></body></html>
